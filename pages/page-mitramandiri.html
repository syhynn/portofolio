    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            overflow-x: hidden;
        }

        /* Enhanced Glassmorphism Panel */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(248, 250, 252, 0.7) 100%);
            border: 1px solid rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(16px);
        }

        /* Glass Hover Effect for Small Items */
        .glass-tag {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-tag:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .gradient-text {
            background: linear-gradient(to right, #a855f7, #3b82f6, #10b981);
            background-size: 200% auto;
            animation: shine 5s linear infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes shine {
            to {
                background-position: 200% center;
            }
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        /* Animated Blob Backgrounds */
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.4;
            mix-blend-mode: multiply;
            transition: transform 0.1s ease-out;
        }

        /* Hide Scrollbar for aesthetic slider */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 3D Flip Card CSS */
        .flip-card {
            perspective: 1000px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        /* Mode Desktop: Menggunakan Hover */
        @media (hover: hover) and (pointer: fine) {
            .flip-card:hover .flip-card-inner {
                transform: rotateY(180deg);
            }
        }

        /* Mode Mobile: Menggunakan class tambahan dari JS */
        .flip-card.is-flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; /* Safari */
            backface-visibility: hidden;
            border-radius: 1.5rem; /* rounded-3xl */
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }

        /* --- ANIMASI SCROLL INTERAKTIF --- */
        .reveal-up {
            opacity: 0;
            transform: translateY(80px);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal-scale {
            opacity: 0;
            transform: scale(0.9) translateY(40px);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal-visible {
            opacity: 1 !important;
            transform: translateY(0) scale(1) !important;
        }
        @keyframes autoBlurReveal {
            0% { opacity: 0; filter: blur(20px); transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; filter: blur(0px); transform: translateY(0) scale(1); }
        }
        .hero-animate {
            animation: autoBlurReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        .d-100 { animation-delay: 100ms; }
        .d-300 { animation-delay: 300ms; }
        .d-500 { animation-delay: 500ms; }
        .d-700 { animation-delay: 700ms; }
    </style>
</head>

    <!-- Script Interaktif untuk Scroll Animasi dan Mobile Flip -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Intersection Observer untuk memicu class '.reveal-visible' ketika elemen masuk layar
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.1
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal-visible');
                        // Opsional: unobserve jika ingin animasi hanya berjalan sekali
                        observer.unobserve(entry.target); 
                    }
                });
            }, observerOptions);

            const revealElements = document.querySelectorAll('.reveal-up, .reveal-scale');
            revealElements.forEach(el => observer.observe(el));

            // 2. Event Listener untuk interaksi klik/sentuh (terutama berguna untuk mobile) 
            // agar menambahkan '.is-flipped' ke kartu.
            const flipCards = document.querySelectorAll('.flip-card');
            flipCards.forEach(card => {
                card.addEventListener('click', function() {
                    // Toggle class pada elemen flip-card
                    this.classList.toggle('is-flipped');
                });
            });
        });
    </script>
